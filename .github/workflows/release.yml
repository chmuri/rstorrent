name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: "false"
          - target: aarch64-unknown-linux-gnu
            cross: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cross
        if: matrix.cross == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$HOME/.cargo/bin"
      - name: Build Web UI
        run: |
          rustup target add wasm32-unknown-unknown
          (cd ui && trunk build --release)
      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}" -p rstorrent -p rt-tui-client
          else
            cargo build --release --target "${{ matrix.target }}" -p rstorrent -p rt-tui-client
          fi
      - name: Package
        run: |
          TUI_BINARY="target/${{ matrix.target }}/release/rstorrent-tui" \
          bash scripts/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/rstorrent" dist
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate release notes
        run: |
          bash scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## ${GITHUB_REF_NAME}" > release-notes.md
            echo "" >> release-notes.md
            echo "See CHANGELOG.md for details." >> release-notes.md
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: "rstorrent ${{ github.ref_name }}"
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
