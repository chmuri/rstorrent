name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: "false"
          - target: aarch64-unknown-linux-gnu
            cross: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cross
        if: matrix.cross == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}" -p rstorrent
          else
            cargo build --release --target "${{ matrix.target }}" -p rstorrent
          fi
      - name: Package
        run: |
          bash scripts/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/rstorrent" dist
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build both architectures on the arm64 runner (Xcode ships a
          # universal SDK); macos-13 (x86_64) is being retired.
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install protoc
        run: brew install protobuf
      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}" -p rstorrent
      - name: Package
        run: |
          bash scripts/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/rstorrent" dist
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release notes
        run: |
          bash scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## ${GITHUB_REF_NAME}" > release-notes.md
            echo "" >> release-notes.md
            echo "See CHANGELOG.md for details." >> release-notes.md
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "rstorrent ${{ github.ref_name }}"
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
