name: "Dependabot Auto-merge"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-automerge:
    name: "Auto-approve and merge on CI success"
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: "Identify Pull Request"
        id: pr
        run: |
          PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" --json number --jq '.[0].number')
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Approve and Merge Pull Request"
        if: steps.pr.outputs.pr_number != ''
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          echo "Approving PR #$PR after green CI verification..."
          gh pr review --approve "$PR" --body "Approved automatically: CI tests and checks passed cleanly on this dependency update."
          echo "Merging PR #$PR..."
          gh pr merge --squash --delete-branch "$PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
