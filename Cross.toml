# Cross-compilation settings (https://github.com/cross-rs/cross).
#
# rt-grpc's build script compiles the protobuf contract at build time, and the
# cross images do not ship protoc, so install it inside the build container.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends curl unzip ca-certificates",
    # The cross image's protobuf-compiler is too old for proto3; use a recent
    # upstream protoc (the container itself is x86_64).
    "curl -fsSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v27.3/protoc-27.3-linux-x86_64.zip",
    "unzip -o /tmp/protoc.zip -d /usr/local",
    "chmod +x /usr/local/bin/protoc",
]
