[workspace]
resolver = "2"
members = [
    "crates/lt-common",
    "crates/lt-sys",
    "crates/lt-crypto",
    "crates/lt-net",
    "crates/lt-storage",
    "crates/lt-dht",
    "crates/lt-tracker",
    "crates/lt-protocol",
    "crates/lt-engine",
    "crates/rt-rpc",
    "crates/rt-scgi",
    "crates/rt-grpc",
    "crates/rt-core",
    "crates/rt-tui",
    "crates/rt-tui-client",
    "crates/rstorrent",
]

[workspace.package]
version = "0.16.1"
edition = "2021"
rust-version = "1.99"
authors = ["chmuri <chmuri@gmail.com>"]
license = "GPL-2.0-or-later"
repository = "https://github.com/chmuri/rstorrent"
homepage = "https://github.com/chmuri/rstorrent"

[workspace.dependencies]
# Internal workspace crates
lt-common = { path = "crates/lt-common" }
lt-sys = { path = "crates/lt-sys" }
lt-crypto = { path = "crates/lt-crypto" }
lt-net = { path = "crates/lt-net" }
lt-storage = { path = "crates/lt-storage" }
lt-dht = { path = "crates/lt-dht" }
lt-tracker = { path = "crates/lt-tracker" }
lt-protocol = { path = "crates/lt-protocol" }
lt-engine = { path = "crates/lt-engine" }
rt-rpc = { path = "crates/rt-rpc" }
rt-scgi = { path = "crates/rt-scgi" }
rt-grpc = { path = "crates/rt-grpc" }
rt-core = { path = "crates/rt-core" }
rt-tui = { path = "crates/rt-tui" }
rt-tui-client = { path = "crates/rt-tui-client" }

# Common dependencies
bytes = "1.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
bitflags = "2.8"
libc = "0.2"
nix = { version = "0.31", features = ["signal", "fs", "process", "socket", "user", "ioctl", "hostname"] }
num-bigint = "0.5"
num-traits = "0.2"
flate2 = "1.0"
base64 = "0.23"
sha1 = "0.11"
rc4 = "0.2"
getrandom = "0.4"
crossbeam-queue = "0.3"
rayon = "1.10"
rustc-hash = "2.1"
hickory-resolver = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
quick-xml = { version = "0.37", features = ["serialize"] }
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
notify = "8.0"
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"
tokio-stream = "0.1"

[profile.dev]
# Use line-tables-only to preserve backtraces without generating tens of GBs of DWARF debug symbols
debug = 1

[profile.test]
debug = 1
