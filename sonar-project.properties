# SonarQube Cloud configuration for chmuri/rstorrent
sonar.projectKey=chmuri_rstorrent
sonar.organization=chmuri

# Exclude documentation, build artifacts and test fixtures from static analysis
sonar.exclusions=docs/**,ui/dist/**,**/tests/fixtures/**,target/**

# Exclude documentation, tests, and benchmarks from duplication detection (CPD)
sonar.cpd.exclusions=docs/**,tests/**,crates/*/tests/**,benches/**,scripts/bench/**,ui/dist/**
